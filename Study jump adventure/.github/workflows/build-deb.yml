name: Gerar DEB Linux

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm pkg set author="Criador <contato@exemplo.com>"
      - run: npm install
      - run: npx electron-builder --linux deb --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: instalador-mint
          path: dist/*.deb
